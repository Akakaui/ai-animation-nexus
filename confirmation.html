<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Confirmed! — AI Animation Nexus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .confirm-layout {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }
    .confirm-card {
      background-color: var(--bg-white);
      border: 2px solid var(--color-ink);
      padding: 56px;
      max-width: 580px;
      width: 100%;
      border-radius: var(--radius-sharp);
      box-shadow: var(--shadow-flat-4);
      text-align: center;
      position: relative;
    }
    .confirm-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: var(--accent-acid);
      border: 1.5px solid var(--color-ink);
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: var(--radius-sharp);
      margin-bottom: 24px;
      box-shadow: var(--shadow-flat-2);
    }
    .confirm-title {
      font-size: 3rem;
      margin-bottom: 16px;
    }
    .confirm-subtext {
      font-size: 0.95rem;
      line-height: 1.55;
      margin-bottom: 32px;
      opacity: 0.85;
    }
    .code-display-box {
      background-color: var(--bg-cream);
      border: 2px solid var(--color-ink);
      padding: 20px;
      border-radius: var(--radius-sharp);
      margin-bottom: 36px;
      position: relative;
      box-shadow: var(--shadow-flat-2);
    }
    .code-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      opacity: 0.6;
      display: block;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }
    .code-value {
      font-family: 'Bricolage Grotesque', serif;
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      display: block;
      margin-bottom: 12px;
    }
    .btn-copy-code {
      background-color: var(--bg-white);
      border: 1.5px solid var(--color-ink);
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: var(--radius-sharp);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .btn-copy-code:hover {
      background-color: var(--accent-acid);
    }
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .calendar-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-calendar {
      width: 100%;
      background-color: var(--bg-white);
      color: var(--color-ink);
      border: 2px solid var(--color-ink);
      padding: 16px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: var(--radius-sharp);
      cursor: pointer;
      box-shadow: var(--shadow-flat-2);
      transition: var(--transition-fast);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-calendar:hover {
      background-color: var(--green-muted);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--color-ink);
    }
    .btn-dashboard {
      width: 100%;
      background-color: var(--accent-acid);
      color: var(--color-ink);
      border: 2px solid var(--color-ink);
      padding: 16px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: var(--radius-sharp);
      cursor: pointer;
      box-shadow: var(--shadow-flat-2);
      transition: var(--transition-fast);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn-dashboard:hover {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0px var(--color-ink);
    }
    
    @media (max-width: 768px) {
      .confirm-card {
        padding: 36px 24px;
      }
      .confirm-title {
        font-size: 2.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="paper-texture"></div>

  <div class="confirm-layout">
    <div class="confirm-card">
      <div class="confirm-badge">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Registration Complete
      </div>
      
      <h1 class="confirm-title">You're Confirmed.</h1>
      
      <p class="confirm-subtext">
        Your access code is on its way to your inbox — check it now and save it somewhere safe. You'll use it every class day to unlock your session link.
      </p>

      <div class="code-display-box">
        <span class="code-label">Your Unique Access Code</span>
        <span class="code-value" id="accessCode">AN-XXXX-XX</span>
        <button class="btn-copy-code" id="copyCodeBtn">Copy Code</button>
      </div>

      <div class="action-group">
        <div class="calendar-buttons">
          <button class="btn-calendar" id="googleCalendarBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            Add All to Google Calendar
          </button>
          <button class="btn-calendar" id="appleCalendarBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/>
              <path d="M12 6v6l4 2"/>
            </svg>
            Add All to Apple Calendar
          </button>
          <button class="btn-calendar" id="outlookBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="M22 7l-10 6L2 7"/>
            </svg>
            Add All to Outlook
          </button>
        </div>

        <button class="btn-dashboard" id="dashboardBtn">
          Go to Your Dashboard
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12H19M19 12L13 6M19 12L13 18"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      // 1. Use a code issued directly by the application flow, or wait for server-confirmed payment.
      const userEmail = localStorage.getItem('nexus_email') || '';
      const localCode = localStorage.getItem('nexus_access_code');
      const paymentRef = localStorage.getItem('payment_ref');
      const codeEl = document.getElementById('accessCode');
      const subtextEl = document.querySelector('.confirm-subtext');
      if (localCode) {
        codeEl.textContent = localCode;
      } else if (userEmail && paymentRef) {
        let confirmed = false;
        for (let attempt = 0; attempt < 15; attempt += 1) {
          try {
            const res = await fetch(`/api/paystack/status?email=${encodeURIComponent(userEmail)}&reference=${encodeURIComponent(paymentRef)}`);
            const data = await res.json();
            if (res.ok && data.paid) { confirmed = true; break; }
          } catch (error) { console.warn('Payment status check failed', error); }
          await new Promise(resolve => setTimeout(resolve, 2000));
        }
        if (!confirmed) {
          codeEl.textContent = 'Pending confirmation';
          subtextEl.textContent = 'Your payment is being confirmed. Check your email for the access code, or contact support if it does not arrive.';
        } else {
          codeEl.textContent = 'Check your email';
          subtextEl.textContent = 'Payment confirmed. Your access code has been sent to your email.';
        }
      } else {
        codeEl.textContent = 'Check your email';
        subtextEl.textContent = 'Your access code has been sent to your email. If you did not receive it, please contact support.';
      }

      // 2. Copy Code to Clipboard
      document.getElementById('copyCodeBtn').addEventListener('click', function() {
        const codeText = document.getElementById('accessCode').textContent;
        navigator.clipboard.writeText(codeText).then(() => {
          this.textContent = '✓ Copied!';
          setTimeout(() => {
            this.textContent = 'Copy Code';
          }, 1500);
        });
      });

      // 3. Navigation
      document.getElementById('dashboardBtn').addEventListener('click', function() {
        window.location.href = 'dashboard.html';
      });

// 4. Calendar Integration - One tap adds ALL 8 sessions
    const sessions = [
      { number: 1, date: '2026-07-24', title: 'Photo-to-Video Transformation', host: 'Augustus Akuwuike' },
      { number: 2, date: '2026-07-25', title: 'Motion-Syncing & Compositing', host: 'Augustus Akuwuike' },
      { number: 3, date: '2026-07-31', title: 'Maintaining Consistent AI Characters', host: 'Bethel Okaibedi' },
      { number: 4, date: '2026-08-01', title: 'Advanced Content Creation Strategy', host: 'Chijioke' },
      { number: 5, date: '2026-08-07', title: 'AI Automation & Workflow Efficiency', host: 'Chijioke' },
      { number: 6, date: '2026-08-08', title: 'Think Like a Creative Director', host: 'Chibuike Ifeoma' },
      { number: 7, date: '2026-08-14', title: 'Building Online Presence with AI', host: 'Chibuike Ifeoma' },
      { number: 8, date: '2026-08-15', title: 'Grand Finale & Studio Standards', host: 'Tochukwu' }
    ];

    function formatICSDate(dateStr, hour = 20, minute = 0) {
      const [year, month, day] = dateStr.split('-').map(Number);
      const d = new Date(Date.UTC(year, month - 1, day, hour, minute, 0));
      return d.toISOString().replace(/[-:]/g, '').replace('.000', '');
    }

    function generateICS() {
      let ics = 'BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//AI Animation Nexus//Calendar//EN\nCALSCALE:GREGORIAN\nMETHOD:PUBLISH\n';
      
      sessions.forEach(s => {
        ics += 'BEGIN:VEVENT\n';
        ics += `DTSTART:${formatICSDate(s.date)}\n`;
        ics += `DTEND:${formatICSDate(s.date, 21)}\n`;
        ics += `SUMMARY:AI Animation Nexus S${s.number}: ${s.title}\n`;
        ics += `DESCRIPTION:Host: ${s.host}\\nAccess your dashboard to verify and get the Zoom link: ${window.location.origin}/dashboard.html\n`;
        ics += 'LOCATION:Zoom Online Video\n';
        ics += `UID:ai-anim-nexus-s${s.number}@${window.location.host}\n`;
        ics += 'STATUS:CONFIRMED\n';
        ics += 'SEQUENCE:0\n';
        ics += 'END:VEVENT\n';
      });
      
      ics += 'END:VCALENDAR';
      return ics;
    }

    function downloadICS() {
      const blob = new Blob([generateICS()], { type: 'text/calendar;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.setAttribute('download', 'AI_Animation_Nexus_All_Sessions.ics');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Apple Calendar / Outlook - Download ICS
    document.getElementById('appleCalendarBtn').addEventListener('click', downloadICS);
    document.getElementById('outlookBtn').addEventListener('click', downloadICS);

    // Google Calendar - Open URL with all events
    document.getElementById('googleCalendarBtn').addEventListener('click', function() {
      // For Google Calendar, we open the first session and include a note about adding remaining sessions
      const first = sessions[0];
      const last = sessions[sessions.length - 1];
      
      const startDate = formatICSDate(first.date);
      const endDate = formatICSDate(last.date, 22, 0);
      
      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: 'AI Animation Nexus - All 8 Sessions',
        dates: `${startDate}/${endDate}`,
        details: `Your AI Animation Nexus course runs July 24 - August 15, 2026.\n\nAccess your personalized dashboard for session links and details:\n${window.location.origin}/dashboard.html\n\nSessions:\n1. ${sessions[0].title} - ${sessions[0].host}\n2. ${sessions[1].title} - ${sessions[1].host}\n3. ${sessions[2].title} - ${sessions[2].host}\n4. ${sessions[3].title} - ${sessions[3].host}\n5. ${sessions[4].title} - ${sessions[4].host}\n6. ${sessions[5].title} - ${sessions[5].host}\n7. ${sessions[6].title} - ${sessions[6].host}\n8. ${sessions[7].title} - ${sessions[7].host}`,
        location: 'Zoom Online Video'
      });
      
      window.open(`https://calendar.google.com/calendar/render?${params.toString()}`, '_blank');
    });
  </script>
</body>
</html>
